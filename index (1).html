<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flip Side: Inequality Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ee;--ink:#1f2340;--muted:#6b6f86;--card:#fff;--line:#ece3d4;--a:#ff6b4a;--b:#3a7bfd;--g:#16a364;--y:#ffb703;--p:#8b5cf6;--r:#e5484d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 70px}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;margin:0;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
[hidden]{display:none!important}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.logo{font-family:Fredoka,sans-serif;font-size:34px;font-weight:700;letter-spacing:.5px}
.logo .f{display:inline-block;color:var(--a);transform:scaleX(-1)}
.tagline{color:var(--muted);margin:0 0 22px}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px;white-space:nowrap}

/* map */
.levels{display:grid;gap:12px}
.trackhd{font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 2px 0}
.trackhd:first-child{margin-top:0}
.aside{color:var(--muted);font-size:14px}
.lvl{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;transition:transform .12s,box-shadow .12s}
.lvl:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--line)}
.lvl.locked{opacity:.55}
.lvl .num{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:Fredoka,sans-serif;font-size:22px;font-weight:700}
.lvl .info{flex:1;min-width:0}
.lvl h3{font-size:19px}
.lvl p{margin:2px 0 8px;color:var(--muted);font-size:15px}
.bar{height:8px;background:#f1ebe0;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.stars{flex:none;font-size:20px;color:var(--y);letter-spacing:2px;min-width:66px;text-align:right}
.foot{margin-top:26px;color:var(--muted);font-size:14px;text-align:center}
.foot button{background:none;border:none;color:var(--b);text-decoration:underline;padding:0 4px;font-size:14px}

/* play */
.playbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.back{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800}
.playbar h2{font-size:21px;flex:1;min-width:140px}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;background:#e8e0d2}
.dots i.on{background:var(--g)}
.dots .extra{font-weight:800;font-size:14px;color:var(--g);margin-left:4px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:0 6px 0 var(--line)}
.prompt{font-size:19px;margin:0 0 8px;font-weight:700}
.prompt.story{font-weight:500;font-size:18px}
.small{color:var(--muted);font-size:14px;margin:6px 0}
.math{font-family:Fredoka,sans-serif;font-size:38px;font-weight:600;text-align:center;margin:14px 0 18px;letter-spacing:1px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.72em;line-height:1.05;margin:0 2px}
.frac>span:first-child{border-bottom:3px solid currentColor;padding:0 4px}
.eq .frac{font-size:.8em}
.eq .frac>span:first-child{border-bottom-width:2px}

.yn{display:flex;gap:12px;justify-content:center}
.btn{border:none;border-radius:14px;padding:11px 20px;font-weight:800;font-size:17px;background:#f1ebe0}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.big{font-size:20px;padding:14px 30px;min-width:130px}
.btn.yes{background:#e4f6ed;color:var(--g)}
.btn.no{background:#fde8e8;color:var(--r)}
.btn:not(:disabled):active{transform:translateY(1px)}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}

.seg{display:inline-flex;background:#f4efe6;border-radius:14px;padding:4px;gap:4px}
.seg button{border:none;background:transparent;border-radius:10px;padding:8px 14px;font-weight:800}
.seg button.sel{background:#fff;box-shadow:0 2px 0 var(--line);color:var(--b)}
.ctrls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}

.builder{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
.builder .var{font-family:Fredoka,sans-serif;font-size:36px;font-weight:600;font-style:italic}
.ops button{font-family:Fredoka,sans-serif;font-size:26px;width:50px;padding:4px 0}
.pm{border:2px solid var(--line);background:#fff;border-radius:12px;width:46px;height:50px;font-size:22px;font-weight:800}
#num{font-family:Fredoka,sans-serif;font-size:30px;width:110px;height:56px;text-align:center;border:3px solid var(--line);border-radius:14px;outline:none;color:var(--ink);background:#fff}
#num:focus{border-color:var(--b)}

#nl svg{width:100%;height:auto;display:block;touch-action:manipulation}
#nl.live svg{cursor:pointer}

.hintbox{margin-top:14px;background:#fff7dd;border:2px dashed #f4cf6b;border-radius:14px;padding:10px 14px;font-size:16px}
.nudge{margin-top:12px;text-align:center;color:var(--a);font-weight:800}

.fb{margin-top:18px;border-radius:18px;padding:16px 16px 18px}
.fb.ok{background:#e8f7ef;border:2px solid #b6e6cc}
.fb.bad{background:#fff0ec;border:2px solid #ffcdbf}
.fb h3{font-size:22px;margin-bottom:6px}
.fb.ok h3{color:var(--g)}
.fb.bad h3{color:var(--a)}
.fb p{margin:6px 0}
.said{color:var(--muted);font-size:15px}
.steps{margin:10px 0;display:grid;gap:6px}
.step{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.step>span:first-child{font-size:15px;flex:1;min-width:180px}
.step .eq{font-family:Fredoka,sans-serif;font-size:22px;font-weight:600;white-space:nowrap}
.step.check{background:#eef6ff}
.step.flip{border:2px solid var(--p);background:#f5f0ff}
.step.flip .eq{color:var(--p)}
.ans{font-size:18px;margin:10px 0 4px}
.ans b{font-family:Fredoka,sans-serif;font-size:22px}
.fb .btn.primary{margin-top:12px;width:100%}

/* tip */
.tag{display:inline-block;color:#fff;font-weight:800;font-size:13px;border-radius:99px;padding:3px 12px;margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.tip h2{font-size:28px;margin-bottom:10px}
.tipbody p{margin:8px 0}
.tipbody .ex{font-family:Fredoka,sans-serif;font-size:22px;background:#f7f2ea;border-radius:12px;padding:8px 14px;margin:8px 0;text-align:center}
.tip .btn{margin-top:14px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(31,35,64,.45);display:grid;place-items:center;padding:16px;z-index:5}
.mbox{background:#fff;border-radius:24px;padding:28px 24px;max-width:400px;width:100%;text-align:center}
.mbox .bigstars{font-size:46px;color:var(--y);letter-spacing:6px;margin:8px 0}
.mbox h2{font-size:30px}
.mbox p{color:var(--muted)}
.mbox .btn{width:100%;margin-top:10px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:6}

@media (max-width:520px){
  #nl svg text,.fb svg text{font-size:24px}
  svg text.odd{display:none}
  .math{font-size:30px}
  .lvl .stars{font-size:16px;min-width:52px}
  .btn.big{min-width:110px;padding:13px 20px}
  .step .eq{font-size:19px}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap">

  <section id="map">
    <div class="top">
      <div class="logo"><span class="f">Flip</span> Side</div>
      <div class="pill">🔥 Best streak: <span id="best">0</span></div>
    </div>
    <p class="tagline">Two quests: isolating the variable, then inequalities. Clear a level to unlock the next one.</p>
    <div class="levels" id="levels"></div>
    <div class="foot">Progress saves in this browser.
      <button id="unlock">Unlock all levels</button>·<button id="reset">Reset progress</button></div>
  </section>

  <section id="play" hidden>
    <div class="playbar">
      <button class="back" id="back">← Map</button>
      <h2 id="lvname"></h2>
      <div class="dots" id="dots"></div>
      <div class="pill">🔥 <span id="streak">0</span></div>
    </div>
    <div class="card" id="card"></div>
  </section>

</div>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script>
//LOGIC-START
const FLIP={'<':'>','>':'<','≤':'≥','≥':'≤'};
const OPS=['<','>','≤','≥'];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nz=(a,b)=>{let n;do{n=ri(a,b)}while(n===0);return n;};
const m=n=>n<0?'−'+Math.abs(n):String(n);
const cmp=(l,op,r)=>op==='<'?l<r:op==='>'?l>r:op==='≤'?l<=r:l>=r;
const OPWORD={'<':'less than','>':'greater than','≤':'less than or equal to','≥':'greater than or equal to'};

function termHTML(a,v){return a===1?v:a===-1?'−'+v:m(a)+v;}
function exprHTML(e,v){
  if(e.kind==='div') return `<span class="frac"><span>${v}</span><span>${m(e.a)}</span></span>`;
  let s=termHTML(e.a,v);
  if(e.b>0) s+=' + '+e.b; else if(e.b<0) s+=' − '+(-e.b);
  return s;
}
function evalE(e,x){return e.kind==='div'?x/e.a:e.a*x+e.b;}
function ineqHTML(p){
  const L=exprHTML(p.e,p.v);
  return p.swapped?`${m(p.c)} ${FLIP[p.op]} ${L}`:`${L} ${p.op} ${m(p.c)}`;
}
function solve(e,op,c,v){
  const steps=[];let o=op,val;
  if(e.kind==='div'){
    val=c*e.a; if(e.a<0) o=FLIP[op];
    steps.push({txt:e.a<0?`Multiply both sides by ${m(e.a)}. Multiplying by a negative <b>flips the sign</b>.`:`Multiply both sides by ${e.a}.`,eq:`${v} ${o} ${m(val)}`,flip:e.a<0});
  }else{
    let r=c;
    if(e.b!==0){r=c-e.b;steps.push({txt:e.b>0?`Subtract ${e.b} from both sides.`:`Add ${-e.b} to both sides.`,eq:`${termHTML(e.a,v)} ${op} ${m(r)}`});}
    val=r/e.a;
    if(e.a!==1){
      if(e.a<0) o=FLIP[op];
      steps.push({txt:e.a<0?`Divide both sides by ${m(e.a)}. Dividing by a negative <b>flips the sign</b>.`:`Divide both sides by ${e.a}.`,eq:`${v} ${o} ${m(val)}`,flip:e.a<0});
    }
  }
  return {op:o,val,steps};
}
function mk(e,op,c,extra){
  const p=Object.assign({type:'solve',v:'x',e,op,c,swapped:false},extra||{});
  p.sol=solve(e,op,c,p.v);
  return p;
}
function firstStepHint(p){
  if(p.swapped) return `Start by rewriting it with ${p.v} on the left side.`;
  return 'First step: '+p.sol.steps[0].txt;
}

/* Level 3: one step, never a flip */
function gen3(){
  const op=pick(OPS),t=pick(['add','add','mul','mul','div']);let e,c;
  if(t==='add'){const k=ri(-9,9);e={kind:'lin',a:1,b:nz(-12,12)};c=k+e.b;}
  else if(t==='mul'){const k=ri(-9,9);e={kind:'lin',a:ri(2,9),b:0};c=e.a*k;}
  else{const a=ri(2,4),lim=Math.floor(9/a);e={kind:'div',a,b:0};c=ri(-lim,lim);}
  const p=mk(e,op,c,{swapped:t!=='div'&&Math.random()<.25});
  p.hint=firstStepHint(p);return p;
}
/* Level 4: negative multipliers, plus decoys that must NOT flip */
function gen4(){
  const op=pick(OPS),r=Math.random();let e,c,decoy=false;
  if(r<.3){const k=ri(-9,-1);e={kind:'lin',a:ri(2,9),b:0};c=e.a*k;decoy=true;}
  else if(r<.75){const k=ri(-9,9),a=Math.random()<.15?-1:-ri(2,9);e={kind:'lin',a,b:0};c=a*k;}
  else{const a=-ri(2,4),lim=Math.floor(9/-a);e={kind:'div',a,b:0};c=ri(-lim,lim);}
  const p=mk(e,op,c);
  p.hint=decoy?'Look at what you divide by. Is THAT number negative?':firstStepHint(p);
  return p;
}
/* Level 5: two steps */
function gen5(){
  const op=pick(OPS),k=ri(-8,8),a=Math.random()<.55?-ri(2,7):ri(2,7),b=nz(-15,15);
  const p=mk({kind:'lin',a,b},op,a*k+b,{swapped:Math.random()<.2});
  p.hint=p.swapped?firstStepHint(p):'Undo the + or − first. Then divide, and check whether you are dividing by a negative.';
  return p;
}
/* Level 1: is it a solution? */
function gen1(){
  let p;do{p=Math.random()<.5?gen3():gen4();}while(p.e.kind!=='lin');
  p.type='test';p.tv=p.sol.val+ri(-2,2);
  p.lhs=evalE(p.e,p.tv);p.truth=cmp(p.lhs,p.op,p.c);
  p.hint=`Replace ${p.v} with ${m(p.tv)}, work out that side, then compare.`;
  return p;
}
/* Level 2: graph it */
function gen2(){
  const k=ri(-8,8),op=pick(OPS),sw=Math.random()<.3;
  const p={type:'graph',v:'x',e:{kind:'lin',a:1,b:0},op,c:k,swapped:sw,sol:{op,val:k,steps:[]}};
  p.hint=(sw?`Read it from x's side first: x ${op} ${m(k)}. `:'')+'Does the solution include the number itself? Only ≤ and ≥ do.';
  return p;
}
/* Level 6: word problems */
const WORD=[
  ()=>{const a=ri(2,5),b=ri(3,10),k=ri(3,9),c=a*k+b;return{v:'t',op:'≤',c,e:{kind:'lin',a,b},key:'"at most what she has" → ≤',
    text:`Maya has <b>$${c}</b> to spend at the fair. Entry costs <b>$${b}</b>, and each ride ticket costs <b>$${a}</b>. How many tickets <b>t</b> can she buy?`,
    note:k=>`She can buy <b>${k} tickets or fewer</b>.`};},
  ()=>{const a=ri(3,8),b=ri(15,30),k=ri(2,9),c=a*k+b;return{v:'g',op:'≤',c,e:{kind:'lin',a,b},key:'"at most" → ≤',
    text:`A phone plan costs <b>$${b}</b> a month plus <b>$${a}</b> for each GB of data. Jay wants his bill to be <b>at most $${c}</b>. How many GB <b>g</b> can he use?`,
    note:k=>`He can use up to <b>${k} GB</b>.`};},
  ()=>{const a=ri(3,9)*5,b=ri(4,20)*5,k=ri(3,9),c=a*k+b;return{v:'n',op:'>',c,e:{kind:'lin',a,b},key:'"more than" → >',
    text:`To beat the high score you need <b>more than ${c}</b> points. You already have <b>${b}</b>, and each coin is worth <b>${a}</b> points. How many coins <b>n</b> do you need?`,
    note:k=>`n > ${k} means ${k} coins isn't enough. You need <b>at least ${k+1}</b>.`};},
  ()=>{const a=ri(2,6),k=ri(3,9),d=ri(5,20),c0=d+a*k;return{v:'m',op:'>',c:d,e:{kind:'lin',a:-a,b:c0},key:'"more than" → >. Draining means minus.',
    text:`A tank holds <b>${c0} liters</b> of water and drains <b>${a} liters every minute</b>. For how many minutes <b>m</b> will it still have <b>more than ${d} liters</b>?`,
    note:k=>`Any time <b>under ${k} minutes</b>.`};},
  ()=>{const a=ri(2,4),k=ri(2,8),b=ri(10,20),c=b-a*k;return{v:'h',op:'<',c,e:{kind:'lin',a:-a,b},key:'"below" → <. Dropping means minus.',
    text:`It's <b>${b}°C</b> outside and the temperature drops <b>${a}° every hour</b>. After how many hours <b>h</b> will it be <b>below ${m(c)}°C</b>?`,
    note:k=>`It's below ${m(c)}°C after <b>more than ${k} hours</b>.`};},
  ()=>{const a=ri(4,12),b=ri(5,40),k=ri(3,9),c=a*k+b;return{v:'w',op:'≥',c,e:{kind:'lin',a,b},key:'"at least" → ≥',
    text:`Priya has <b>$${b}</b> saved and adds <b>$${a} every week</b>. How many weeks <b>w</b> until she has <b>at least $${c}</b>?`,
    note:k=>`She needs <b>${k} weeks or more</b>.`};},
];
function gen6(){
  const w=pick(WORD)();
  const p=mk(w.e,w.op,w.c,{v:w.v,word:true,text:w.text});
  p.note=w.note(p.sol.val);p.hint='Key phrase: '+w.key;
  return p;
}
/* ---------- equations: isolating the variable ---------- */
function poly(ts,v){
  return ts.map(([c,x],i)=>{const a=Math.abs(c),body=x?(a===1?v:a+v):String(a);
    return i===0?(c<0?'−':'')+body:(c<0?' − ':' + ')+body;}).join('');
}
const frac=(t,b)=>`<span class="frac"><span>${t}</span><span>${b}</span></span>`;
function finish(A,B,C,v,st){ // A·v + B = C
  let r=C;
  if(B!==0){r=C-B;st.push({txt:B>0?`Subtract ${B} from both sides.`:`Add ${-B} to both sides.`,eq:`${poly([[A,1]],v)} = ${m(r)}`});}
  if(A!==1) st.push({txt:`Divide both sides by ${m(A)}.`+(A<0?' <span class="aside">(No flip: this is an equation. Flips are only for inequalities.)</span>':''),eq:`${v} = ${m(r/A)}`});
  return r/A;
}
function eqP(html,k,st,L,R,hint){return {type:'eqn',v:'x',html,val:k,steps:st,L,R,hint:hint||('First step: '+st[0].txt)};}
function maybeSwap(p,left,right){
  if(Math.random()<.2){p.html=`${right} = ${left}`;p.steps.unshift({txt:'Swap the two sides so x is on the left. (Equal is equal either way.)',eq:`${left} = ${right}`});p.hint='Start by swapping the sides so x is on the left.';}
  return p;
}
function genE1(){
  const t=pick(['add','add','mul','div']),st=[];let k=ri(-12,12);
  if(t==='add'){const b=nz(-15,15),c=k+b,l=poly([[1,1],[b,0]],'x');finish(1,b,c,'x',st);return maybeSwap(eqP(`${l} = ${m(c)}`,k,st,c,c),l,m(c));}
  if(t==='mul'){const a=pick([-1,1])*ri(2,9),c=a*k,l=poly([[a,1]],'x');finish(a,0,c,'x',st);return maybeSwap(eqP(`${l} = ${m(c)}`,k,st,c,c),l,m(c));}
  const a=pick([-1,1])*ri(2,5),q=ri(-6,6);k=a*q;
  st.push({txt:`Multiply both sides by ${m(a)}.`,eq:`x = ${m(k)}`});
  return eqP(`${frac('x',m(a))} = ${m(q)}`,k,st,q,q);
}
function genE2(){
  const r=Math.random(),st=[];let k=ri(-10,10);
  if(r<.25){const a=pick([-1,1])*ri(2,5),q=ri(-6,6),b=nz(-12,12);k=a*q;const c=q+b;
    st.push({txt:b>0?`Subtract ${b} from both sides.`:`Add ${-b} to both sides.`,eq:`${frac('x',m(a))} = ${m(q)}`});
    st.push({txt:`Multiply both sides by ${m(a)}.`,eq:`x = ${m(k)}`});
    return eqP(`${frac('x',m(a))} ${b>0?'+':'−'} ${Math.abs(b)} = ${m(c)}`,k,st,c,c);}
  if(r<.45){const a=ri(2,9),b=ri(2,20),c=b-a*k;
    st.push({txt:`Subtract ${b} from both sides. The minus sign stays with the ${a}x.`,eq:`−${a}x = ${m(c-b)}`});
    st.push({txt:`Divide both sides by −${a}.`,eq:`x = ${m(k)}`});
    return eqP(`${b} − ${a}x = ${m(c)}`,k,st,c,c,'The x-term is negative here: it’s −'+a+'x. Move the '+b+' first.');}
  const a=pick([-1,1])*ri(2,9),b=nz(-15,15),c=a*k+b,l=poly([[a,1],[b,0]],'x');finish(a,b,c,'x',st);
  return maybeSwap(eqP(`${l} = ${m(c)}`,k,st,c,c),l,m(c));
}
function genE3(){
  const st=[],k=ri(-9,9);
  if(Math.random()<.55){const a=pick([-1,1])*ri(2,6),b=nz(-9,9),c=a*(k+b);
    st.push({txt:`Distribute the ${m(a)}: multiply it by <b>both</b> terms inside.`,eq:`${poly([[a,1],[a*b,0]],'x')} = ${m(c)}`});
    finish(a,a*b,c,'x',st);
    return eqP(`${m(a)}(${poly([[1,1],[b,0]],'x')}) = ${m(c)}`,k,st,c,c,`Distribute first: ${m(a)} times x, and ${m(a)} times ${m(b)}.`);}
  let p,q;do{p=nz(-6,8);q=nz(-6,8);}while(p+q===0);
  const b=nz(-12,12),c=(p+q)*k+b,ts=Math.random()<.5?[[p,1],[q,1],[b,0]]:[[p,1],[b,0],[q,1]];
  st.push({txt:`Combine like terms: ${poly([[p,1]],'x')} and ${poly([[q,1]],'x')} make ${poly([[p+q,1]],'x')}.`,eq:`${poly([[p+q,1],[b,0]],'x')} = ${m(c)}`});
  finish(p+q,b,c,'x',st);
  return eqP(`${poly(ts,'x')} = ${m(c)}`,k,st,c,c,'Combine the x-terms first. Keep each sign with the term after it.');
}
function genE4(){
  let a,cc;do{a=nz(-8,9);cc=nz(-8,9);}while(a===cc);
  const b=nz(-12,12),k=ri(-9,9),d=(a-cc)*k+b,st=[],ab=Math.abs(cc),tx=ab===1?'x':ab+'x';
  const right=d===0?poly([[cc,1]],'x'):poly([[cc,1],[d,0]],'x');
  st.push({txt:`${cc>0?'Subtract':'Add'} ${tx} ${cc>0?'from':'to'} both sides so all the x's are on the left.`,eq:`${poly([[a-cc,1],[b,0]],'x')} = ${m(d)}`});
  finish(a-cc,b,d,'x',st);
  const v=a*k+b;
  return eqP(`${poly([[a,1],[b,0]],'x')} = ${right}`,k,st,v,v,'Get the x-terms together on one side first.');
}
function gen7(){return pick([gen1,gen2,gen3,gen4,gen5,gen5,gen6,genE2,genE4])();}
//LOGIC-END

const LEVELS=[
  {track:'eq',name:'One step',sub:'Undo one operation',goal:5,gen:genE1,color:'#0f766e',
   tip:`<p>To isolate the variable, do the <b>opposite</b> operation to both sides. Whatever you do to one side, do to the other so it stays balanced.</p>
   <div class="ex">x + 7 = 3 → x = −4</div><div class="ex">−5x = 30 → x = −6</div>`},
  {track:'eq',name:'Two steps',sub:'Undo + or − first, then × or ÷',goal:6,gen:genE2,color:'#0891b2',
   tip:`<p>Undo things in <b>reverse order</b>. Socks go on before shoes, so shoes come off first. Adding/subtracting comes off before multiplying/dividing.</p>
   <div class="ex">3x − 5 = 16 → 3x = 21 → x = 7</div>
   <p>Check by plugging it back in: 3(7) − 5 = 16 ✓</p>`},
  {track:'eq',name:'Tidy up first',sub:'Distribute and combine like terms',goal:6,gen:genE3,color:'#c2410c',
   tip:`<p><b>Distribute:</b> multiply the outside number by <i>every</i> term inside.</p>
   <div class="ex">−2(x − 3) = −2x + 6</div>
   <p><b>Combine like terms:</b> x-terms go together, plain numbers go together.</p>
   <div class="ex">4x + 3 − x = 3x + 3</div><p>After tidying, it's just a two-step problem.</p>`},
  {track:'eq',name:'Both sides',sub:'x on the left and the right',goal:6,gen:genE4,color:'#be185d',
   tip:`<p>First move all the x-terms to one side.</p>
   <div class="ex">5x + 2 = 2x + 14 → 3x + 2 = 14 → x = 4</div>
   <p>Dividing by a negative here? That's fine. Nothing flips, because flipping only happens with inequalities.</p>`},
  {track:'in',name:'Is it a solution?',sub:'Plug in and check',goal:5,gen:gen1,color:'#3a7bfd',
   tip:`<p>A <b>solution</b> is any number that makes the inequality true. To test one, plug it in.</p>
   <div class="ex">x + 3 > 8</div>
   <p>Try 6: 6 + 3 = 9, and 9 > 8 ✓. Try 5: 5 + 3 = 8, and 8 > 8? ✗ Equal isn't bigger.</p>`},
  {track:'in',name:'Graph it',sub:'Dots and arrows',goal:5,gen:gen2,color:'#16a364',
   tip:`<p><b>Open dot ○</b> for &lt; and &gt;: the number itself is <i>not</i> a solution.<br><b>Closed dot ●</b> for ≤ and ≥: it is.</p>
   <p>Then shade toward all the other solutions.</p>
   <div class="ex">5 > x &nbsp;means&nbsp; x < 5</div>
   <p>Careful when x is on the right. Read it starting from x.</p>`},
  {track:'in',name:'One step',sub:'Solve it like an equation',goal:5,gen:gen3,color:'#ffb703',
   tip:`<p>Solve an inequality the same way you'd solve an equation: do the same thing to both sides until x is alone.</p>
   <div class="ex">x − 4 ≥ 3 &nbsp;→&nbsp; x ≥ 7</div>
   <p>Type your answer with the symbol buttons. Use ± for negatives.</p>`},
  {track:'in',name:'The flip',sub:'When negatives turn it around',goal:6,gen:gen4,color:'#8b5cf6',
   tip:`<p>Start with something true: <b>2 &lt; 5</b>. Multiply both sides by −1 and you get −2 and −5.</p>
   <div class="ex">−2 > −5</div>
   <p>The symbol had to flip, because negatives run in reverse order on the number line.</p>
   <p><b>Rule:</b> flip only when you <b>multiply or divide by a negative</b>. A negative number on the other side doesn't count. Some problems here are traps.</p>`},
  {track:'in',name:'Two steps',sub:'Undo +/− first, then ×/÷',goal:6,gen:gen5,color:'#ff6b4a',
   tip:`<p>Undo the adding or subtracting first, then the multiplying or dividing. The flip can only happen on that second step.</p>
   <div class="ex">−2x + 5 < 11 → −2x < 6 → x > −3</div>`},
  {track:'in',name:'Word problems',sub:'Words → symbols → answer',goal:5,gen:gen6,color:'#0ea5b7',
   tip:`<p>Turn the words into symbols:</p>
   <div class="ex">at most ≤ &nbsp;·&nbsp; at least ≥ &nbsp;·&nbsp; more than > &nbsp;·&nbsp; below <</div>
   <p>Set up the inequality on scrap paper, solve it, then type your answer. Ask: does it make sense?</p>`},
  {track:'in',name:'Boss round',sub:'Everything, mixed',goal:8,gen:gen7,color:'#1f2340',
   tip:`<p>Every kind of inequality, plus some equations, shuffled. Get 8 right to beat the game.</p>`},
];

const PRAISE=['Correct!','Yes!','Nailed it.','Right on.','Exactly.','Got it.'];
const OOPS=['Not quite.','Close, but no.','Let’s look at it.','Almost.'];

const LS='flipside-v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(LS));}catch(e){}
function fresh(){return {lv:LEVELS.map(()=>({c:0,w:0,done:false,stars:0})),best:0,unlocked:false};}
if(S&&Array.isArray(S.lv)&&S.lv.length===7) S.lv=[0,0,0,0].map(()=>({c:0,w:0,done:false,stars:0})).concat(S.lv);
if(!S||!Array.isArray(S.lv)||S.lv.length!==LEVELS.length) S=fresh();
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}};

const $=s=>document.querySelector(s);
let G={li:0,p:null,answered:false,streak:0,pendingWin:false,op:null,nl:{pt:null,closed:null,dir:null}};

/* ---------- number line ---------- */
const NX=n=>30+(n+10)*30;
function nlSVG(st,color,live){
  color=color||'#3a7bfd';
  let s=`<svg viewBox="0 0 660 92" xmlns="http://www.w3.org/2000/svg" ${live?'id="nlsvg"':''}>`;
  if(live) s+=`<rect x="0" y="0" width="660" height="92" fill="transparent"/>`;
  s+=`<line x1="14" y1="40" x2="646" y2="40" stroke="#1f2340" stroke-width="2.5"/>`;
  s+=`<path d="M6 40 L18 33 L18 47Z" fill="#1f2340"/><path d="M654 40 L642 33 L642 47Z" fill="#1f2340"/>`;
  for(let n=-10;n<=10;n++){
    const x=NX(n),z=n===0;
    s+=`<line x1="${x}" y1="${z?30:33}" x2="${x}" y2="${z?50:47}" stroke="#1f2340" stroke-width="${z?2.5:1.5}"/>`;
    s+=`<text class="${n%2?'odd':''}" x="${x}" y="74" text-anchor="middle" font-family="Nunito,sans-serif" font-size="17" font-weight="${z?800:600}" fill="#1f2340">${m(n)}</text>`;
  }
  if(st.pt!==null&&st.dir){
    const x=NX(st.pt),end=st.dir==='right'?640:20;
    s+=`<line x1="${x}" y1="40" x2="${end}" y2="40" stroke="${color}" stroke-width="7" stroke-linecap="round"/>`;
    s+=st.dir==='right'?`<path d="M656 40 L638 29 L638 51Z" fill="${color}"/>`:`<path d="M4 40 L22 29 L22 51Z" fill="${color}"/>`;
  }
  if(st.pt!==null){
    const x=NX(st.pt),fill=st.closed===true?color:'#fff',stroke=st.closed===null?'#9aa0b5':color;
    s+=`<circle cx="${x}" cy="40" r="10" fill="${fill}" stroke="${stroke}" stroke-width="3.5"/>`;
  }
  return s+'</svg>';
}
function solState(sol){return {pt:sol.val,closed:sol.op==='≤'||sol.op==='≥',dir:(sol.op==='>'||sol.op==='≥')?'right':'left'};}
function drawLiveNL(){
  const box=$('#nl');box.innerHTML=nlSVG(G.nl,'#3a7bfd',true);
  const svg=$('#nlsvg');
  svg.addEventListener('click',ev=>{
    if(G.answered) return;
    const r=svg.getBoundingClientRect();
    const vx=(ev.clientX-r.left)*660/r.width;
    G.nl.pt=Math.max(-10,Math.min(10,Math.round((vx-30)/30-10)));
    drawLiveNL();
  });
}

/* ---------- map ---------- */
function lvNum(i){let n=0;for(let j=0;j<=i;j++) if(LEVELS[j].track===LEVELS[i].track) n++;return n;}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n);}
function showMap(){
  $('#play').hidden=true;$('#map').hidden=false;
  const g=$('#levels');g.innerHTML='';
  LEVELS.forEach((L,i)=>{
    if(i===0||LEVELS[i-1].track!==L.track){const hd=document.createElement('h3');hd.className='trackhd';
      hd.textContent=L.track==='eq'?'Part 1 · Isolate the variable':'Part 2 · Inequalities';g.appendChild(hd);}
    const st=S.lv[i],locked=!S.unlocked&&i>0&&LEVELS[i-1].track===L.track&&!S.lv[i-1].done;
    const d=document.createElement('button');
    d.className='lvl'+(locked?' locked':'');d.disabled=locked;
    d.innerHTML=`<div class="num" style="background:${L.color}">${locked?'🔒':lvNum(i)}</div>
      <div class="info"><h3>${L.name}</h3><p>${L.sub}</p>
      <div class="bar"><i style="width:${Math.min(100,st.c/L.goal*100)}%;background:${L.color}"></i></div></div>
      <div class="stars">${st.done?starStr(st.stars):''}</div>`;
    d.onclick=()=>startLevel(i);
    g.appendChild(d);
  });
  $('#best').textContent=S.best;
}

/* ---------- play ---------- */
function updateBar(){
  const L=LEVELS[G.li],st=S.lv[G.li];
  $('#lvname').textContent=L.name;
  let d='';for(let i=0;i<L.goal;i++) d+=`<i class="${i<st.c?'on':''}"></i>`;
  if(st.c>L.goal) d+=`<span class="extra">+${st.c-L.goal}</span>`;
  $('#dots').innerHTML=d;$('#streak').textContent=G.streak;
}
function startLevel(i){
  G.li=i;G.streak=0;
  $('#map').hidden=true;$('#play').hidden=false;updateBar();
  const L=LEVELS[i];
  $('#card').innerHTML=`<div class="tip"><span class="tag" style="background:${L.color}">${L.track==='eq'?'Equations':'Inequalities'} · Level ${lvNum(i)}</span>
    <h2>${L.name}</h2><div class="tipbody">${L.tip}</div>
    <button class="btn primary" id="go">Let's go →</button></div>`;
  $('#go').onclick=nextProblem;$('#go').focus();
  window.scrollTo(0,0);
}
function nextProblem(){
  G.p=LEVELS[G.li].gen();G.answered=false;G.op=null;G.nl={pt:null,closed:null,dir:null};
  renderProblem();
}
function renderProblem(){
  const p=G.p;let h='';
  if(p.type==='test'){
    h+=`<p class="prompt">Is <b>${p.v} = ${m(p.tv)}</b> a solution?</p><div class="math">${ineqHTML(p)}</div>
      <div class="yn"><button class="btn big yes" data-a="1">Yes ✓</button><button class="btn big no" data-a="0">No ✗</button></div>`;
  }else if(p.type==='graph'){
    h+=`<p class="prompt">Graph this on the number line.</p><div class="math">${ineqHTML(p)}</div>
      <div id="nl" class="live"></div><p class="small" style="text-align:center">Tap the line to place the dot, then pick the dot type and direction.</p>
      <div class="ctrls"><div class="seg" id="dot"><button data-v="open">○ Open</button><button data-v="closed">● Closed</button></div>
      <div class="seg" id="dir"><button data-v="left">← Left</button><button data-v="right">Right →</button></div></div>`;
  }else if(p.type==='eqn'){
    h+=`<p class="prompt">Solve for <b>x</b>.</p><div class="math">${p.html}</div>
      <div class="builder"><span class="var">x</span><span class="var" style="font-style:normal">=</span>
      <button class="pm" id="pm" title="Make negative">±</button>
      <input id="num" inputmode="numeric" autocomplete="off" placeholder="?"></div>`;
  }else{
    if(p.word) h+=`<p class="prompt story">${p.text}</p><p class="small">Set up an inequality on paper, solve it, then enter your answer.</p>`;
    else h+=`<p class="prompt">Solve for <b>${p.v}</b>.</p><div class="math">${ineqHTML(p)}</div>`;
    h+=`<div class="builder"><span class="var">${p.v}</span>
      <div class="seg ops" id="ops">${OPS.map(o=>`<button data-v="${o}">${o}</button>`).join('')}</div>
      <button class="pm" id="pm" title="Make negative">±</button>
      <input id="num" inputmode="numeric" autocomplete="off" placeholder="?"></div>`;
  }
  h+=`<div class="actions">${p.type!=='test'?'<button class="btn primary" id="check">Check</button>':''}<button class="btn ghost" id="hint">💡 Hint</button></div>
    <div id="hintwrap"></div><div id="nudge"></div><div id="fb"></div>`;
  $('#card').innerHTML=h;

  if(p.type==='test') document.querySelectorAll('.yn button').forEach(b=>b.onclick=()=>checkTest(b.dataset.a==='1'));
  if(p.type==='graph'){
    drawLiveNL();
    segWire('#dot',v=>{G.nl.closed=v==='closed';drawLiveNL();});
    segWire('#dir',v=>{G.nl.dir=v;drawLiveNL();});
  }
  if(p.type==='solve') segWire('#ops',v=>{G.op=v;});
  if(p.type==='solve'||p.type==='eqn'){
    $('#pm').onclick=()=>{const i=$('#num');let s=i.value.replace('−','-').trim();i.value=s.startsWith('-')?s.slice(1):'-'+s;i.focus();};
  }
  if($('#check')) $('#check').onclick=()=>p.type==='graph'?checkGraph():p.type==='eqn'?checkEqn():checkSolve();
  $('#hint').onclick=()=>{$('#hintwrap').innerHTML=`<div class="hintbox">💡 ${p.hint}</div>`;};
}
function segWire(sel,fn){
  const w=$(sel);
  w.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(G.answered) return;
    w.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');fn(b.dataset.v);
  });
}
function nudge(t){$('#nudge').innerHTML=`<div class="nudge">${t}</div>`;}

function stepsHTML(p){
  let rows=[{txt:p.word?'Set it up:':'Start:',eq:ineqHTML(p)}];
  if(p.swapped) rows.push({txt:`Rewrite with ${p.v} on the left. Same meaning: the symbol still opens toward the bigger side.`,eq:`${exprHTML(p.e,p.v)} ${p.op} ${m(p.c)}`});
  rows=rows.concat(p.sol.steps);
  return `<div class="steps">${rows.map(r=>`<div class="step${r.flip?' flip':''}"><span>${r.txt}</span><span class="eq">${r.eq}</span></div>`).join('')}</div>`;
}
function answerBlock(p){
  return `<div class="ans">Answer: <b>${p.v} ${p.sol.op} ${m(p.sol.val)}</b></div>${nlSVG(solState(p.sol),'#16a364')}${p.note?`<p>${p.note}</p>`:''}`;
}

function checkTest(said){
  if(G.answered) return;
  const p=G.p,ok=said===p.truth;
  const xs=m(p.tv),e=p.e;
  let sub=e.a===1?xs:e.a===-1?`−(${xs})`:`${m(e.a)}(${xs})`;
  if(e.b>0) sub+=' + '+e.b; else if(e.b<0) sub+=' − '+(-e.b);
  const q=p.swapped?`${m(p.c)} ${FLIP[p.op]} ${m(p.lhs)}`:`${m(p.lhs)} ${p.op} ${m(p.c)}`;
  let d=`<div class="steps"><div class="step"><span>Plug in ${p.v} = ${xs}:</span><span class="eq">${sub} = ${m(p.lhs)}</span></div>
    <div class="step"><span>Is this true?</span><span class="eq">${q} &nbsp;${p.truth?'✓':'✗'}</span></div></div>`;
  if(p.lhs===p.c) d+=`<p>The two sides are <b>equal</b>. That only counts for ≤ or ≥.</p>`;
  d+=`<p>${p.truth?`So ${xs} <b>is</b> a solution.`:`So ${xs} is <b>not</b> a solution.`} All the solutions:</p>${answerBlock(p)}`;
  grade(ok,d);
}
function checkGraph(){
  if(G.answered) return;
  const p=G.p,n=G.nl;
  if(n.pt===null||n.closed===null||!n.dir){nudge('Place a dot, choose open or closed, and pick a direction.');return;}
  const want=solState(p.sol),probs=[];
  if(n.pt!==want.pt) probs.push(`The dot goes at <b>${m(want.pt)}</b>.`);
  if(n.closed!==want.closed) probs.push(want.closed?`Use a <b>closed</b> dot: ${p.sol.op} includes ${m(want.pt)} itself.`:`Use an <b>open</b> dot: ${p.sol.op} does not include ${m(want.pt)} itself.`);
  if(n.dir!==want.dir) probs.push(`Solutions are ${OPWORD[p.sol.op].replace(' or equal to','')} ${m(want.pt)}, so shade to the <b>${want.dir}</b>.`);
  let d='';
  if(p.swapped) d+=`<p>${ineqHTML(p)} means <b>x ${p.op} ${m(p.c)}</b>.</p>`;
  if(probs.length) d+=probs.map(t=>`<p>${t}</p>`).join('');
  d+=`<p>Correct graph:</p>${nlSVG(want,'#16a364')}`;
  grade(!probs.length,d);
}
function checkSolve(){
  if(G.answered) return;
  const p=G.p,raw=$('#num').value.replace(/−/g,'-').replace(/\s/g,'');
  if(!G.op){nudge('Pick a symbol: <, >, ≤ or ≥.');return;}
  if(!/^-?\d+$/.test(raw)){nudge('Type a whole number. Use ± to make it negative.');return;}
  const n=parseInt(raw,10),s=p.sol,ok=G.op===s.op&&n===s.val;
  const flipNeeded=s.steps.some(x=>x.flip);
  let d=`<p class="said">You said: ${p.v} ${G.op} ${m(n)}</p>`;
  if(!ok){
    if(n===s.val&&G.op===FLIP[s.op]) d+= flipNeeded?`<p><b>Right number, but you forgot to flip the sign.</b> Look for the purple step.</p>`
      : p.swapped?`<p><b>Right number, but the symbol got turned around</b> when you moved ${p.v} to the left.</p>`
      :`<p><b>Right number, but no flip here.</b> You only flip when you multiply or divide by a negative.</p>`;
    else if(n===s.val) d+=`<p><b>Right number.</b> Check the "or equal to" part of the symbol.</p>`;
    else if(n===-s.val&&n!==0) d+=`<p><b>Right size, wrong sign.</b> Watch the negatives.</p>`;
  }
  d+=stepsHTML(p)+answerBlock(p);
  grade(ok,d);
}

function checkEqn(){
  if(G.answered) return;
  const p=G.p,raw=$('#num').value.replace(/−/g,'-').replace(/\s/g,'');
  if(!/^-?\d+$/.test(raw)){nudge('Type a whole number. Use ± to make it negative.');return;}
  const n=parseInt(raw,10),ok=n===p.val;
  let d=`<p class="said">You said: x = ${m(n)}</p>`;
  if(!ok&&n===-p.val) d+=`<p><b>Right size, wrong sign.</b> Watch the negatives.</p>`;
  const rows=[{txt:'Start:',eq:p.html}].concat(p.steps);
  d+=`<div class="steps">${rows.map(r=>`<div class="step"><span>${r.txt}</span><span class="eq">${r.eq}</span></div>`).join('')}
    <div class="step check"><span>Check: put x = ${m(p.val)} back into the original. Left side = ${m(p.L)}, right side = ${m(p.R)}.</span><span class="eq">✓</span></div></div>
    <div class="ans">Answer: <b>x = ${m(p.val)}</b></div>`;
  grade(ok,d);
}
function grade(ok,detail){
  G.answered=true;
  const st=S.lv[G.li],L=LEVELS[G.li];
  if(ok){st.c++;G.streak++;S.best=Math.max(S.best,G.streak);}else{st.w++;G.streak=0;}
  if(!st.done&&st.c>=L.goal){st.done=true;st.stars=st.w<=1?3:st.w<=3?2:1;G.pendingWin=true;}
  save();updateBar();
  $('#card').querySelectorAll('button,input').forEach(b=>b.disabled=true);
  $('#nudge').innerHTML='';
  const streakNote=ok&&G.streak>=3?` <span style="font-size:16px">🔥 ${G.streak} in a row</span>`:'';
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?pick(PRAISE):pick(OOPS)}${streakNote}</h3>${detail}
    <button class="btn primary" id="next">${G.pendingWin?'Finish level 🎉':'Next →'}</button></div>`;
  $('#next').onclick=()=>{if(G.pendingWin){G.pendingWin=false;win();}else nextProblem();};
  $('#next').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function win(){
  const i=G.li,st=S.lv[i],last=i===LEVELS.length-1;
  $('#mbox').innerHTML=`<h2>${last?'You beat the game!':'Level complete!'}</h2>
    <div class="bigstars">${starStr(st.stars)}</div>
    <p>${st.c} right, ${st.w} wrong. ${st.stars<3?'Fewer misses earns more stars next time.':'Flawless.'}</p>
    ${last?'':`<button class="btn primary" id="mnext">${LEVELS[i+1].track!==LEVELS[i].track?'On to inequalities →':'Next level →'}</button>`}
    <button class="btn" id="mmore">Keep practicing</button>
    <button class="btn ghost" id="mmap">Back to map</button>`;
  $('#modal').hidden=false;confetti();
  if($('#mnext')) $('#mnext').onclick=()=>{$('#modal').hidden=true;startLevel(i+1);};
  $('#mmore').onclick=()=>{$('#modal').hidden=true;nextProblem();};
  $('#mmap').onclick=()=>{$('#modal').hidden=true;showMap();};
}

function confetti(){
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ff6b4a','#3a7bfd','#16a364','#ffb703','#8b5cf6'];
  const P=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:7+Math.random()*7,c:pick(cols)}));
  let t=0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=.12;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++t<220) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height);
  })();
}

/* ---------- wiring ---------- */
$('#back').onclick=showMap;
$('#unlock').onclick=()=>{S.unlocked=true;save();showMap();};
let resetArm=false;
$('#reset').onclick=()=>{
  if(!resetArm){resetArm=true;$('#reset').textContent='Tap again to reset';setTimeout(()=>{resetArm=false;$('#reset').textContent='Reset progress';},3000);return;}
  S=fresh();save();resetArm=false;$('#reset').textContent='Reset progress';showMap();
};
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter'||$('#play').hidden||!$('#modal').hidden) return;
  if($('#go')){ev.preventDefault();$('#go').click();return;}
  if(G.answered&&$('#next')){ev.preventDefault();$('#next').click();}
  else if(!G.answered&&$('#check')){ev.preventDefault();$('#check').click();}
});
showMap();
</script>
